name: Build paper-trading image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen strategy
        run: sha256sum --check strategies/SHA256SUMS
      - name: Validate Compose
        env:
          UI_PASSWORD: ci-validation-placeholder
          JWT_SECRET: ci-validation-placeholder
          WS_TOKEN: ci-validation-placeholder
        run: docker compose config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build native validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: btc-paper:verify
      - name: Validate image offline
        run: docker run --rm --network none --entrypoint python -v "$PWD/tests:/tests:ro" btc-paper:verify /tests/verify_image.py
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jensdevlaming/freqtrade:main
            ghcr.io/jensdevlaming/freqtrade:sha-${{ github.sha }}
