services:
  freqtrade:
    image: ghcr.io/jensdevlaming/freqtrade:${IMAGE_TAG:-main}
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - trade
      - --dry-run
      - --config
      - /opt/btc/config/paper.json
      - --strategy-path
      - /opt/btc/strategies
      - --strategy
      - DynamicBtc
      - --userdir
      - /freqtrade/user_data
      - --db-url
      - sqlite:////freqtrade/user_data/tradesv3.paper.sqlite
      - --logfile
      - /freqtrade/user_data/logs/freqtrade.log
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${UI_USERNAME:-freqtrader}
      FREQTRADE__API_SERVER__PASSWORD: ${UI_PASSWORD:?Set UI_PASSWORD in Portainer}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${JWT_SECRET:?Set JWT_SECRET in Portainer}
      FREQTRADE__API_SERVER__WS_TOKEN: ${WS_TOKEN:?Set WS_TOKEN in Portainer}
    ports:
      - "${BIND_IP:-127.0.0.1}:${UI_PORT:-8080}:8080"
    volumes:
      - bot-data:/freqtrade/user_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5)); assert r.get('status') == 'pong'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
